services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Reviewers replace ./data with their own copy (TASK.pdf §10.1)
      - ./data:/app/data
      # Disposable ingestion cache, kept outside ./data
      - cache:/app/cache

volumes:
  cache:
