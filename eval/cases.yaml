# Eval cases for the assessment corpus and dev DB (APP_TODAY 2026-09-15).
#
# Expected values live here only — never in app code (TASK.pdf §4.1). They were
# taken from the corpus text; a modified corpus needs its own cases.
#
# Per turn, all keys optional:
#   route:         allowed routes
#   cite_all:      every one of these doc_ids must be cited          (recall)
#   cite_any:      at least one of these must be cited
#   cite_ok:       may also be cited without counting as wrong      (precision)
#   cite_none:     must never be cited
#   answer_has:    each item must appear (an item may be a list of alternatives)
#   answer_lacks:  none of these may appear
#   tool:          {name, status, args} — args is a subset to match
#   pending:       expected pending_confirmation
#
# Employees: E1001 IN employee (L2), E1002 US employee, E1003 DE employee,
# E1004 IN employee (joined 2025-11-03), M2001 IN manager of E1001+E1002,
# M2002 DE manager, H9001 IN HR.

